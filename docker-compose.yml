version: "3.9"

services:
  # ── Backend: FastAPI ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portfolio_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env

  # ── Frontend: Next.js ───────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Points the browser at the backend on your Lightsail static IP
        NEXT_PUBLIC_BACKEND_URL: ""
        NEXT_PUBLIC_GITHUB_USERNAME: Sanskaragrawal2107
        NEXT_PUBLIC_LEETCODE_USERNAME: sanskaragrawal
    container_name: portfolio_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BACKEND_URL=
      - NEXT_PUBLIC_GITHUB_USERNAME=Sanskaragrawal2107
      - NEXT_PUBLIC_LEETCODE_USERNAME=sanskaragrawal
